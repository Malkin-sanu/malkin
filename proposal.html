<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Last Question...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-6 relative">

    <div class="max-w-xl w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden fade-in z-10 relative border border-white/40 text-center">
        <div class="bg-gradient-to-r from-red-600 to-pink-500 p-6 md:p-8">
            <h1 class="text-4xl md:text-5xl font-bold text-white heading-font mb-2">Ek Aakhiri Sawal... 🥺</h1>
        </div>
        
        <div class="p-6 md:p-8 space-y-4">
            <h2 class="text-3xl md:text-4xl font-bold text-red-600 heading-font pulse mb-6">Kya tum meri Girlfriend banogi?? 💍❤️</h2>
            
            <form onsubmit="sendFeedback(event)" class="text-left mt-6">
                <label class="block text-rose-700 font-semibold mb-2">Tumhara Jawab:</label>
                <select id="answer" class="w-full bg-rose-50 border border-rose-200 text-rose-800 p-3 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-rose-400 font-medium">
                    <option value="Haa! Main tumhari Girlfriend banungi ❤️">Haa! (Yes) 😍</option>
                    <option value="Mujhe thoda sochne ka time chahiye...">Sochne do thoda,
                        lakin bas 2 minute hai 🤔</option>
                </select>

                <label class="block text-rose-700 font-semibold mb-2">Kuch aur kehna chahti ho?:</label>
                <textarea id="message" rows="3" class="w-full bg-rose-50 border border-rose-200 text-rose-800 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-400 font-medium" placeholder="Apne dil ki baat yahan likho..."></textarea>

                <button type="submit" class="w-full mt-6 bg-red-600 hover:bg-red-700 text-white text-lg font-bold py-3 px-8 rounded-xl transition duration-300 shadow-lg pulse">
                    Send Answer 💌
                </button>
            </form>
        </div>

        <div class="p-4 bg-rose-50 border-t">
            <a href="cake.html" class="text-rose-600 hover:text-rose-800 transition font-medium">
                ⬅ Piche Jayein
            </a>
        </div>
    </div>

    <script>
        function sendFeedback(event) {
            event.preventDefault();
            const answer = document.getElementById('answer').value;
            const message = document.getElementById('message').value;
            
            // Bhai yahan par apna asli email id daal dena
            const email = "jishan340@gmail.com"; 
            
            const subject = encodeURIComponent("My Answer! ❤️");
            const body = encodeURIComponent("Mera Jawab: " + answer + "\n\nDil Ki Baat: " + message);
            window.location.href = "mailto:" + email + "?subject=" + subject + "&body=" + body;
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
