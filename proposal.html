<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Last Question...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="relative overflow-x-hidden text-gray-900">
    <!-- Final Proposal Section -->
    <div id="final-proposal-section" class="min-h-screen w-full flex items-center justify-center p-4 md:p-6 relative bg-gradient-to-b from-transparent via-pink-500/20 to-rose-500/30">
        <!-- Floating hearts just for this section -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
            <div class="absolute top-10 left-10 text-white opacity-40 animate-bounce" style="animation-duration: 3s; font-size: 2rem;">❤️</div>
            <div class="absolute top-40 right-10 md:right-20 text-white opacity-40 animate-pulse hidden md:block" style="animation-duration: 4s; font-size: 1.5rem;">💖</div>
            <div class="absolute bottom-20 left-1/4 text-white opacity-40 animate-bounce hidden md:block" style="animation-duration: 5s; font-size: 2.5rem;">💕</div>
            <div class="absolute top-1/3 right-1/4 text-white opacity-40 animate-pulse" style="animation-duration: 3.5s; font-size: 1.8rem;">💗</div>
        </div>

        <div class="max-w-2xl w-full bg-white/90 md:bg-white/20 backdrop-blur-none md:backdrop-blur-xl rounded-3xl shadow-none md:shadow-[0_8px_32px_0_rgba(255,105,180,0.4)] border border-pink-200 md:border-white/40 text-center p-8 md:p-12 transform transition-all duration-1000 z-10" style="will-change: transform, opacity;">
            <p class="text-sm md:text-base text-pink-500 md:text-pink-100 font-semibold tracking-widest uppercase mb-4 md:opacity-90">And finally… ❤️</p>
            <p class="text-lg md:text-xl text-pink-700 md:text-white drop-shadow-none md:drop-shadow-md font-medium mb-8">There’s something I’ve been wanting to ask you...</p>
            
            <h2 class="text-4xl md:text-6xl font-bold text-pink-600 md:text-white drop-shadow-none md:drop-shadow-lg heading-font mb-12 leading-tight">Will you be my girlfriend? 🥺❤️</h2>
            
            <div id="proposal-buttons" class="flex flex-col md:flex-row gap-4 justify-center items-center">
                <button onclick="handleProposal('yes')" class="w-full md:w-auto bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-4 px-10 rounded-full shadow-md md:shadow-xl transform transition hover:scale-105 active:scale-95 text-lg">
                    YES ❤️
                </button>
                <button onclick="handleProposal('time')" class="w-full md:w-auto bg-rose-100 md:bg-white/20 hover:bg-rose-200 md:hover:bg-white/30 text-rose-700 md:text-white border border-rose-200 md:border-white/50 backdrop-blur-none md:backdrop-blur-none md:backdrop-blur-sm font-semibold py-4 px-10 rounded-full shadow-none md:shadow-lg transform transition hover:scale-105 active:scale-95 text-lg">
                    I NEED A LITTLE TIME 🥺
                </button>
            </div>

            <div id="proposal-response" class="hidden mt-8 transition-opacity duration-500 opacity-0 flex flex-col items-center">
                <h3 id="response-title" class="text-3xl md:text-4xl font-bold text-pink-600 md:text-white drop-shadow-none md:drop-shadow-md heading-font mb-3"></h3>
                <p id="response-text" class="text-lg text-pink-500 md:text-pink-100 font-medium drop-shadow-none mb-6"></p>
            </div>
        </div>
    </div>

    <script>
        function sendMailtoMessage(answer) {
            const email = "jishan330@gmail.com"; 
            const subject = encodeURIComponent("My Answer! ❤️");
            const body = encodeURIComponent("Mera Jawab: " + answer);
            window.location.href = "mailto:" + email + "?subject=" + subject + "&body=" + body;
        }

        function handleProposal(choice) {
            const buttonsDiv = document.getElementById('proposal-buttons');
            const responseDiv = document.getElementById('proposal-response');
            const responseTitle = document.getElementById('response-title');
            const responseText = document.getElementById('response-text');

            buttonsDiv.style.display = 'none';
            responseDiv.classList.remove('hidden');
            
            // Trigger reflow for transition
            void responseDiv.offsetWidth;
            responseDiv.classList.remove('opacity-0');
            responseDiv.classList.add('opacity-100');

            if (choice === 'yes') {
                responseTitle.innerText = "You just made me the happiest person. ❤️";
                responseText.innerText = "Thank you for choosing me. 🥹❤️";
                
                if(typeof launchHeartConfetti === 'function') {
                    launchHeartConfetti();
                }

                // Automatically open mail app after 1.5 seconds so she can see the animation and message
                setTimeout(() => {
                    sendMailtoMessage('YES ❤️');
                }, 1500);
            } else {
                responseTitle.innerText = "Take all the time you need.";
                responseText.innerText = "I just wanted you to know how I feel. ❤️";
            }
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
