<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake - Happy Birthday</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-10 px-4 text-center relative overflow-x-hidden">

    <div class="fade-in max-w-lg z-10 relative">
        <h1 class="text-4xl md:text-5xl font-bold text-white drop-shadow-md heading-font mb-4">Make a Wish, My Love! ✨</h1>
        <p class="text-pink-100 font-medium mb-10 text-lg">Candles par click karo unhe bujhane ke liye!</p>
        
        <!-- The Cake -->
        <div class="cake relative">
            <div class="candle candle-1">
                <div class="flame"></div>
            </div>
            <div class="candle candle-2">
                <div class="flame"></div>
            </div>
            <div class="candle candle-3">
                <div class="flame"></div>
            </div>
        </div>

        <!-- Hidden Message that appears after candles are blown out -->
        <div id="final-message" class="hidden-message mt-8 md:mt-12">
            <h2 class="text-5xl md:text-6xl font-bold text-white drop-shadow-md heading-font mb-4 pulse">Happy Birthday Sanu! ❤️</h2>
            <p class="text-xl md:text-2xl text-white drop-shadow-md font-medium">Always be happy.</p>
            <p class="text-base md:text-lg text-pink-100 mt-2">Dua hai ki tumhari har khwahish poori ho, meri har dua ke sath.</p>
            
            <a href="proposal.html" class="inline-block mt-8 bg-white text-pink-500 hover:bg-red-50 text-lg font-semibold py-3 px-8 rounded-full transition duration-300 shadow-lg pulse">
                Ek Aakhiri Sawal... ➔
            </a>
        </div>
        
        <div class="mt-16 text-pink-200">
            <a href="wishes.html" class="hover:text-white drop-shadow-md transition font-medium">⬅ Dil Ki Baatein</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
