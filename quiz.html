<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Happy Birthday</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative">

    <div class="max-w-2xl w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden fade-in z-10 relative border border-white/40 text-center">
        <div class="bg-gradient-to-r from-pink-400 to-rose-400 p-6">
            <h1 class="text-4xl font-bold text-white drop-shadow-md heading-font">Chota Sa Quiz 🙈</h1>
        </div>
        
        <div class="p-8 space-y-6">
            <h2 class="text-2xl font-semibold text-rose-700">Sawal: Mujhe tumhari sabse acchi aadat kya lagti hai?</h2>
            
            <div class="space-y-4 mt-6">
                <button onclick="alert('Galat jawab! Par ye bhi sach hai 😂')" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-800 font-medium py-3 px-6 rounded-xl border border-rose-200 transition">Tumhara gussa aur kalesh karna</button>
                <button onclick="alert('Galat jawab! Aisa mat socho!')" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-800 font-medium py-3 px-6 rounded-xl border border-rose-200 transition">Tumhari zidd</button>
                <button onclick="alert('Bilkul Sahi! Yahi toh jaan hai meri ❤️')" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-800 font-medium py-3 px-6 rounded-xl border border-rose-200 transition">Mera hamesha khayal rakhna aur pyar jatana</button>
            </div>
        </div>

        <div class="p-6 bg-rose-50 border-t flex justify-between items-center">
            <a href="reasons.html" class="text-rose-600 hover:text-rose-800 transition font-medium">
                ⬅ Khaas Baatein
            </a>
            <a href="promises.html" class="bg-pink-400 hover:bg-pink-500 text-white drop-shadow-md font-semibold py-3 px-8 rounded-full transition duration-300 shadow-lg pulse">
                Mere Vade ➔
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
